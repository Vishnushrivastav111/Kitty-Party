<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Logout | MicroVault</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="../css/app.css" />
</head>
<body>
  <div class="dashboard">
    <div class="main-content">
      <div class="panel" style="max-width:480px;margin:40px auto;text-align:center">
        <div style="font-size:42px;color:var(--navy);margin-bottom:12px"><i class="fas fa-right-from-bracket"></i></div>
        <h1 style="color:var(--navy);margin-bottom:8px">Sign out</h1>
        <p style="color:var(--muted);margin-bottom:20px">Are you sure you want to end your MicroVault session?</p>
        <div class="form-actions" style="justify-content:center">
          <button type="button" class="btn btn-outline" id="cancelBtn">Cancel</button>
          <button type="button" class="btn btn-danger" id="confirmBtn">Logout</button>
        </div>
      </div>
    </div>
  </div>
  <script src="../js/app.js"></script>
  <script src="../js/sidebar.js"></script>
  <script>
  (async function () {
    const user = await MVSidebar.initLayout({ page: "logout.html", title: "Logout" });
    if (!user) throw new Error("auth");
    document.getElementById("cancelBtn").onclick = () =>
      (window.location.href = MV.getHomePage(user.role));
    document.getElementById("confirmBtn").onclick = async function () {
      await MV.logout();
      window.location.href = "../html/login.html";
    };
  })();
  </script>
</body>
</html>
