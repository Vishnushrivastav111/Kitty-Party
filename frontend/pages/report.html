<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reports | MicroVault</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="../css/app.css" />
</head>
<body>
  <div class="dashboard">
    <div class="main-content">
      <div class="page-header"><h1>Reports</h1><p>Generate, preview, and download period summaries</p></div>
      <div class="panel">
        <h2 style="margin-bottom:14px;color:var(--navy)">Generate report</h2>
        <form id="genForm" novalidate>
          <div class="form-grid">
            <div class="form-group"><label for="fromDate">From date</label><input type="date" id="fromDate" /><span class="field-error" id="fromDateError"></span></div>
            <div class="form-group"><label for="toDate">To date</label><input type="date" id="toDate" /><span class="field-error" id="toDateError"></span></div>
            <div class="form-group"><label for="reportType">Report type</label>
              <select id="reportType"><option>Summary</option><option>Transactions</option><option>Savings</option><option>Budget</option></select>
            </div>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary"><i class="fas fa-file-lines"></i> Generate</button>
          </div>
        </form>
        <div id="preview" style="margin-top:14px"></div>
      </div>

      <div class="panel">
        <div class="panel-header">
          <h2>Report history</h2>
          <button class="btn btn-danger btn-sm" id="clearAll"><i class="fas fa-trash"></i> Clear all</button>
        </div>
        <div class="toolbar">
          <input type="search" id="search" placeholder="Search reports..." />
          <select id="filterType">
            <option value="">All types</option>
            <option>Summary</option><option>Transactions</option><option>Savings</option><option>Budget</option>
          </select>
        </div>
        <div class="table-wrap">
          <table class="data-table color-table">
            <thead><tr><th>Generated</th><th>Type</th><th>Period</th><th>Income</th><th>Expense</th><th>Net</th><th>Actions</th></tr></thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
        <div class="pagination" id="pagination"></div>
      </div>
    </div>
  </div>
  <script src="../js/app.js"></script>
  <script src="../js/sidebar.js"></script>
  <script>
  (async function () {
    const user = await MVSidebar.initLayout({ page: "report.html", title: "Reports" });
    if (!user) throw new Error("auth");
    const today = MV.todayISO();
    document.getElementById("toDate").value = today;
    const d = new Date(); d.setDate(1);
    document.getElementById("fromDate").value = d.toISOString().slice(0, 10);
    MV.bindMaxDate();

    let lastGeneratedId = null;

    function showPreview(r) {
      document.getElementById("preview").innerHTML = `
        <div class="alert-box info">
          <strong>${r.type} report</strong><br/>
          Period ${MV.formatDate(r.fromDate)} to ${MV.formatDate(r.toDate)} ·
          Income ${MV.formatINR(r.income)} · Expense ${MV.formatINR(r.expense)} ·
          Net ${MV.formatINR(r.net)} · Tx count ${r.txCount}
          <div class="form-actions" style="margin-top:12px">
            <button type="button" class="btn btn-primary btn-sm" id="dlTxt"><i class="fas fa-download"></i> Download TXT</button>
            <button type="button" class="btn btn-navy btn-sm" id="dlCsv"><i class="fas fa-file-csv"></i> Download CSV</button>
          </div>
        </div>`;
      document.getElementById("dlTxt").onclick = () => MV.downloadReport(r.id, "txt");
      document.getElementById("dlCsv").onclick = () => MV.downloadReport(r.id, "csv");
    }

    const table = MV.createTableController({
      perPage: 6,
      getData: () => MV.listFor(MV.KEYS.reports),
      searchKeys: ["type", "fromDate", "toDate"],
      paginationEl: "#pagination",
      renderRows(rows) {
        const body = document.getElementById("tbody");
        if (!rows.length) { body.innerHTML = '<tr><td colspan="7" class="empty-state">No reports yet</td></tr>'; return; }
        body.innerHTML = rows.map((r, i) => `
          <tr class="row-tone-${i % 4}">
            <td>${MV.formatDate(r.createdAt)}</td>
            <td><span class="badge badge-info">${r.type}</span></td>
            <td>${MV.formatDate(r.fromDate)} – ${MV.formatDate(r.toDate)}</td>
            <td class="amt-pos">${MV.formatINR(r.income)}</td>
            <td class="amt-neg">${MV.formatINR(r.expense)}</td>
            <td class="${r.net >= 0 ? "amt-pos" : "amt-neg"}">${MV.formatINR(r.net)}</td>
            <td>
              <button class="btn btn-outline btn-sm" data-view="${r.id}" title="View"><i class="fas fa-eye"></i></button>
              <button class="btn btn-primary btn-sm" data-dl="${r.id}" title="Download"><i class="fas fa-download"></i></button>
              <button class="btn btn-navy btn-sm" data-csv="${r.id}" title="CSV"><i class="fas fa-file-csv"></i></button>
              <button class="btn btn-danger btn-sm" data-del="${r.id}" title="Delete"><i class="fas fa-trash"></i></button>
            </td>
          </tr>`).join("");
        body.querySelectorAll("[data-view]").forEach((b) => {
          b.onclick = () => {
            const r = MV.getReportById(b.dataset.view);
            if (r) showPreview(r);
          };
        });
        body.querySelectorAll("[data-dl]").forEach((b) => {
          b.onclick = () => MV.downloadReport(b.dataset.dl, "txt");
        });
        body.querySelectorAll("[data-csv]").forEach((b) => {
          b.onclick = () => MV.downloadReport(b.dataset.csv, "csv");
        });
        body.querySelectorAll("[data-del]").forEach((b) => b.onclick = () => {
          MV.confirmDelete("Are you sure you want to delete this report?").then(async (ok) => {
            if (!ok) return;
            await MV.deleteItem(MV.KEYS.reports, b.dataset.del);
            table.render();
          });
        });
      },
    });
    table.bindSearch("#search");
    table.bindFilter("#filterType", "type");
    table.render();

    document.getElementById("genForm").addEventListener("submit", async function (e) {
      e.preventDefault();
      const fromDate = document.getElementById("fromDate").value;
      const toDate = document.getElementById("toDate").value;
      const type = document.getElementById("reportType").value;
      const errors = {
        fromDate: MV.Validators.dateNotFuture(fromDate, "From date"),
        toDate: MV.Validators.dateNotFuture(toDate, "To date"),
      };
      if (!errors.fromDate && !errors.toDate && fromDate > toDate) errors.toDate = "To date must be on or after From date";
      Object.keys(errors).forEach((k) => MV.showFieldError(k, errors[k]));
      if (Object.values(errors).some(Boolean)) return;

      const txs = MV.listFor(MV.KEYS.transactions).filter((t) => t.date >= fromDate && t.date <= toDate);
      const income = txs.filter((t) => t.type === "income").reduce((s, t) => s + Number(t.amount || 0), 0);
      const expense = txs.filter((t) => t.type === "expense").reduce((s, t) => s + Number(t.amount || 0), 0);
      const row = await MV.addItem(MV.KEYS.reports, {
        type, fromDate, toDate, income, expense, net: income - expense, txCount: txs.length,
      });
      lastGeneratedId = row.id;
      showPreview(row);
      MV.pushNotification("Report generated", type + " report is ready to download.", "success");
      table.render();
    });

    document.getElementById("clearAll").onclick = function () {
      const count = MV.listFor(MV.KEYS.reports).length;
      if (!count) {
        MV.showNotice("There are no reports to clear.", "Clear All");
        return;
      }
      MV.confirmDelete("Clear all " + count + " report" + (count === 1 ? "" : "s") + "? This cannot be undone.").then(async (ok) => {
        if (!ok) return;
        await MV.saveFor(MV.KEYS.reports, []);
        document.getElementById("preview").innerHTML = "";
        table.render();
      });
    };
  })();
  </script>
</body>
</html>
