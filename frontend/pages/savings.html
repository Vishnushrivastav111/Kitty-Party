<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Savings | MicroVault</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="../css/app.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="dashboard">
    <div class="main-content">
      <div class="page-header"><h1>Savings</h1><p>Record deposits and withdrawals toward your vault</p></div>
      <div class="cards" id="cards"></div>
      <div class="charts-grid">
        <div class="chart-card">
          <h3><i class="fas fa-chart-line"></i> Balance growth</h3>
          <div class="chart-wrap"><canvas id="savLine"></canvas></div>
        </div>
        <div class="chart-card">
          <h3><i class="fas fa-chart-pie"></i> By category</h3>
          <div class="chart-wrap"><canvas id="savPie"></canvas></div>
        </div>
      </div>
      <div class="panel">
        <div class="panel-header">
          <h2>Savings history</h2>
          <button class="btn btn-danger btn-sm" id="clearAll"><i class="fas fa-trash"></i> Clear all</button>
          <button class="btn btn-primary btn-sm" id="openAdd"><i class="fas fa-plus"></i> Add entry</button>
        </div>
        <div class="toolbar">
          <input type="search" id="search" placeholder="Search title or note..." />
          <select id="filterCategory">
            <option value="">All categories</option>
            <option>Opening</option><option>Deposit</option><option>Withdrawal</option>
            <option>Interest</option><option>Transfer</option><option>Other</option>
          </select>
        </div>
        <div class="table-wrap">
          <table class="data-table">
            <thead><tr><th>Date</th><th>Title</th><th>Category</th><th>Amount</th><th>Note</th><th>Actions</th></tr></thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
        <div class="pagination" id="pagination"></div>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="modal">
    <div class="modal">
      <h3 id="modalTitle">Add savings entry</h3>
      <form id="form" novalidate>
        <input type="hidden" id="editId" />
        <div class="form-grid">
          <div class="form-group"><label for="date">Date</label><input type="date" id="date" /><span class="field-error" id="dateError"></span></div>
          <div class="form-group"><label for="title">Title</label><input id="title" /><span class="field-error" id="titleError"></span></div>
          <div class="form-group"><label for="category">Category</label>
            <select id="category"><option value="">Select</option><option>Opening</option><option>Deposit</option><option>Withdrawal</option><option>Interest</option><option>Transfer</option><option>Other</option></select>
            <span class="field-error" id="categoryError"></span>
          </div>
          <div class="form-group"><label for="amount">Amount (₹)</label><input type="number" id="amount" /><span class="field-error" id="amountError"></span></div>
          <div class="form-group" style="grid-column:1/-1"><label for="note">Note</label><input id="note" /><span class="field-error" id="noteError"></span></div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-outline" id="closeModal">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/app.js"></script>
  <script src="../js/sidebar.js"></script>
  <script>
  (async function () {
    const user = await MVSidebar.initLayout({ page: "savings.html", title: "Savings" });
    if (!user) throw new Error("auth");
    const modal = document.getElementById("modal");

    function refreshCards() {
      const list = MV.listFor(MV.KEYS.savings);
      const total = list.reduce((s, x) => s + (Number(x.amount) || 0), 0);
      const deposits = list.filter((x) => Number(x.amount) > 0).reduce((s, x) => s + Number(x.amount), 0);
      document.getElementById("cards").innerHTML = `
        <div class="card"><div class="card-icon green"><i class="fas fa-piggy-bank"></i></div><div><h3>Total balance</h3><h2>${MV.formatINR(total)}</h2></div></div>
        <div class="card"><div class="card-icon teal"><i class="fas fa-arrow-trend-up"></i></div><div><h3>Positive entries</h3><h2>${MV.formatINR(deposits)}</h2></div></div>
        <div class="card"><div class="card-icon navy"><i class="fas fa-list"></i></div><div><h3>Entries</h3><h2>${list.length}</h2></div></div>`;
    }

    function openModal(row) {
      document.getElementById("modalTitle").textContent = row ? "Edit entry" : "Add savings entry";
      document.getElementById("editId").value = row ? row.id : "";
      document.getElementById("date").value = row ? row.date : MV.todayISO();
      document.getElementById("title").value = row ? row.title : "";
      document.getElementById("category").value = row ? row.category : "Deposit";
      document.getElementById("amount").value = row ? row.amount : "";
      document.getElementById("note").value = row ? row.note || "" : "";
      modal.classList.add("open");
      MV.bindMaxDate();
    }
    document.getElementById("openAdd").onclick = () => openModal(null);
    document.getElementById("closeModal").onclick = () => modal.classList.remove("open");

    const table = MV.createTableController({
      perPage: 6,
      getData: () => MV.listFor(MV.KEYS.savings),
      searchKeys: ["title", "note", "category"],
      paginationEl: "#pagination",
      renderRows(rows) {
        const body = document.getElementById("tbody");
        if (!rows.length) { body.innerHTML = '<tr><td colspan="6" class="empty-state">No savings entries</td></tr>'; return; }
        body.innerHTML = rows.map((r) => `
          <tr>
            <td>${MV.formatDate(r.date)}</td><td>${r.title}</td><td>${r.category}</td>
            <td>${MV.formatINR(r.amount)}</td><td>${r.note || "—"}</td>
            <td>
              <button class="btn btn-outline btn-sm" data-edit="${r.id}"><i class="fas fa-pen"></i></button>
              <button class="btn btn-danger btn-sm" data-del="${r.id}"><i class="fas fa-trash"></i></button>
            </td>
          </tr>`).join("");
        body.querySelectorAll("[data-edit]").forEach((b) => b.onclick = () => openModal(MV.listFor(MV.KEYS.savings).find((x) => String(x.id) === String(b.dataset.edit))));
        body.querySelectorAll("[data-del]").forEach((b) => b.onclick = () => {
          MV.confirmDelete("Are you sure you want to delete this savings entry?").then(async (ok) => {
            if (!ok) return;
            await MV.deleteItem(MV.KEYS.savings, b.dataset.del);
            refreshCards();
            table.render();
          });
        });
      },
    });
    table.bindSearch("#search");
    table.bindFilter("#filterCategory", "category");
    refreshCards();
    table.render();

    (function drawSavCharts() {
      const list = MV.listFor(MV.KEYS.savings).slice().reverse();
      let run = 0;
      const labels = [];
      const data = [];
      list.forEach((s) => {
        run += Number(s.amount) || 0;
        labels.push(MV.formatDate(s.date));
        data.push(run);
      });
      new Chart(document.getElementById("savLine"), {
        type: "line",
        data: {
          labels: labels.length ? labels : ["—"],
          datasets: [{
            label: "Balance",
            data: data.length ? data : [0],
            borderColor: MV.CHART_COLORS[0],
            backgroundColor: "rgba(13,148,136,0.18)",
            fill: true,
            tension: 0.35,
          }],
        },
        options: { responsive: true, maintainAspectRatio: false },
      });
      const byCat = {};
      MV.listFor(MV.KEYS.savings).forEach((s) => {
        byCat[s.category] = (byCat[s.category] || 0) + Math.abs(Number(s.amount) || 0);
      });
      new Chart(document.getElementById("savPie"), {
        type: "pie",
        data: {
          labels: Object.keys(byCat).length ? Object.keys(byCat) : ["None"],
          datasets: [{ data: Object.values(byCat).length ? Object.values(byCat) : [1], backgroundColor: MV.CHART_COLORS, borderWidth: 0 }],
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: "bottom" } } },
      });
    })();

    document.getElementById("form").addEventListener("submit", async function (e) {
      e.preventDefault();
      const payload = {
        date: document.getElementById("date").value,
        title: document.getElementById("title").value.trim(),
        category: document.getElementById("category").value,
        amount: Number(document.getElementById("amount").value),
        note: document.getElementById("note").value.trim(),
      };
      const errors = {
        date: MV.Validators.dateNotFuture(payload.date),
        title: MV.Validators.required(payload.title, "Title"),
        category: MV.Validators.required(payload.category, "Category"),
        amount: document.getElementById("amount").value === "" ? "Amount is required" : isNaN(payload.amount) ? "Enter a valid amount" : "",
      };
      Object.keys(errors).forEach((k) => MV.showFieldError(k, errors[k]));
      if (Object.values(errors).some(Boolean)) return;
      const id = document.getElementById("editId").value;
      if (id) await MV.updateItem(MV.KEYS.savings, id, payload);
      else await MV.addItem(MV.KEYS.savings, payload);
      modal.classList.remove("open");
      refreshCards();
      table.render();
    });

    document.getElementById("clearAll").onclick = function () {
      const count = MV.listFor(MV.KEYS.savings).length;
      if (!count) {
        MV.showNotice("There are no savings entries to clear.", "Clear All");
        return;
      }
      MV.confirmDelete("Clear all " + count + " savings entr" + (count === 1 ? "y" : "ies") + "? This cannot be undone.").then(async (ok) => {
        if (!ok) return;
        await MV.saveFor(MV.KEYS.savings, []);
        location.reload();
      });
    };
  })();
  </script>
</body>
</html>
