<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Admins | MicroVault</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="../css/app.css" />
</head>
<body>
  <div class="dashboard">
    <div class="main-content">
      <div class="page-header">
        <h1>Manage admins</h1>
        <p>Super Admin only — create and maintain admin accounts</p>
      </div>
      <div class="panel">
        <div class="panel-header">
          <h2>Admin accounts</h2>
          <button class="btn btn-primary btn-sm" id="openAdd"><i class="fas fa-user-plus"></i> Add admin</button>
        </div>
        <div class="toolbar">
          <input type="search" id="search" placeholder="Search admin name or email..." />
          <select id="filterStatus">
            <option value="">All statuses</option>
            <option value="active">Active</option>
            <option value="inactive">Inactive</option>
          </select>
        </div>
        <div class="table-wrap">
          <table class="data-table">
            <thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Created</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
        <div class="pagination" id="pagination"></div>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="modal">
    <div class="modal">
      <h3 id="modalTitle">Add admin</h3>
      <form id="form" novalidate>
        <input type="hidden" id="editId" />
        <div class="form-grid">
          <div class="form-group"><label for="fullName">Full name</label><input id="fullName" /><span class="field-error" id="fullNameError"></span></div>
          <div class="form-group"><label for="email">Email</label><input type="email" id="email" /><span class="field-error" id="emailError"></span></div>
          <div class="form-group"><label for="phone">Phone</label><input id="phone" maxlength="10" /><span class="field-error" id="phoneError"></span></div>
          <div class="form-group"><label for="password">Password</label><input type="password" id="password" /><span class="field-error" id="passwordError"></span></div>
          <div class="form-group"><label for="status">Status</label>
            <select id="status"><option value="active">Active</option><option value="inactive">Inactive</option></select>
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-outline" id="closeModal">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/app.js"></script>
  <script src="../js/sidebar.js"></script>
  <script>
  (async function () {
    const user = await MVSidebar.initLayout({
      page: "superadmin-admins.html",
      title: "Manage Admins",
      roles: [MV.ROLES.SUPERADMIN],
    });
    if (!user) throw new Error("auth");

    const modal = document.getElementById("modal");
    function openModal(row) {
      document.getElementById("modalTitle").textContent = row ? "Edit admin" : "Add admin";
      document.getElementById("editId").value = row ? row.id : "";
      document.getElementById("fullName").value = row ? row.fullName : "";
      document.getElementById("email").value = row ? row.email : "";
      document.getElementById("phone").value = row ? row.phone || "" : "";
      document.getElementById("password").value = "";
      document.getElementById("password").placeholder = row ? "Leave blank to keep current" : "Create password";
      document.getElementById("status").value = row ? row.status || "active" : "active";
      modal.classList.add("open");
      MV.bindPasswordToggles(modal);
    }
    document.getElementById("openAdd").onclick = () => openModal(null);
    document.getElementById("closeModal").onclick = () => modal.classList.remove("open");

    const table = MV.createTableController({
      perPage: 6,
      getData: () => MV.getAdmins(),
      searchKeys: ["fullName", "email", "phone"],
      paginationEl: "#pagination",
      renderRows(rows) {
        const body = document.getElementById("tbody");
        if (!rows.length) { body.innerHTML = '<tr><td colspan="6" class="empty-state">No admins yet — add one</td></tr>'; return; }
        body.innerHTML = rows.map((u) => `
          <tr>
            <td>${u.fullName}</td><td>${u.email}</td><td>${u.phone || "—"}</td>
            <td>${MV.formatDate(u.createdAt)}</td>
            <td><span class="badge ${u.status === "active" ? "badge-success" : "badge-neutral"}">${u.status || "active"}</span></td>
            <td>
              <button class="btn btn-outline btn-sm" data-edit="${u.id}"><i class="fas fa-pen"></i></button>
              <button class="btn btn-danger btn-sm" data-del="${u.id}"><i class="fas fa-trash"></i></button>
            </td>
          </tr>`).join("");
        body.querySelectorAll("[data-edit]").forEach((b) =>
          b.onclick = () => openModal(MV.getAdmins().find((x) => String(x.id) === String(b.dataset.edit)))
        );
        body.querySelectorAll("[data-del]").forEach((b) =>
          b.onclick = () => {
            MV.confirmDelete("Are you sure you want to delete this admin?").then(async (ok) => {
              if (!ok) return;
              const res = await MV.adminDeleteUser(b.dataset.del);
              if (!res.ok) {
                MV.showNotice(res.message, "Cannot delete");
                return;
              }
              table.render();
            });
          }
        );
      },
    });
    table.bindSearch("#search");
    table.bindFilter("#filterStatus", "status");
    table.render();

    document.getElementById("form").addEventListener("submit", async function (e) {
      e.preventDefault();
      const id = document.getElementById("editId").value;
      const fullName = document.getElementById("fullName").value.trim();
      const email = document.getElementById("email").value.trim();
      const phone = document.getElementById("phone").value.trim() || "9000000000";
      const password = document.getElementById("password").value;
      const status = document.getElementById("status").value;
      const errors = {
        fullName: MV.Validators.name(fullName),
        email: MV.Validators.email(email),
        phone: MV.Validators.phone(phone),
        password: id ? (password ? MV.Validators.password(password) : "") : MV.Validators.password(password),
      };
      Object.keys(errors).forEach((k) => MV.showFieldError(k, errors[k]));
      if (Object.values(errors).some(Boolean)) return;

      if (id) {
        const other = MV.findUserByEmail(email);
        if (other && other.id !== id) { MV.showFieldError("email", "Email already in use"); return; }
        const patch = { fullName, email: email.toLowerCase(), phone, status, role: MV.ROLES.ADMIN };
        if (password) patch.password = password;
        const res = await MV.adminUpdateUser(id, patch);
        if (!res.ok) { alert(res.message); return; }
      } else {
        const res = await MV.createAdmin({ fullName, email, phone, password });
        if (!res.ok) { MV.showFieldError("email", res.message); return; }
        await MV.adminUpdateUser(res.user.id, { status });
      }
      modal.classList.remove("open");
      table.render();
    });
  })();
  </script>
</body>
</html>
