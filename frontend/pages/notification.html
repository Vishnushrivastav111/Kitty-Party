<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notifications | MicroVault</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="../css/app.css" />
</head>
<body>
  <div class="dashboard">
    <div class="main-content">
      <div class="page-header">
        <h1>Notifications</h1>
        <p>Alerts for savings, budgets, goals, and system updates</p>
      </div>
      <div class="panel">
        <div class="panel-header">
          <h2>Inbox</h2>
          <button class="btn btn-outline btn-sm" id="markAll">Mark all read</button>
          <button class="btn btn-danger btn-sm" id="clearAll"><i class="fas fa-trash"></i> Clear all</button>
        </div>
        <div class="toolbar">
          <input type="search" id="search" placeholder="Search notifications..." />
          <select id="filterType">
            <option value="">All types</option>
            <option value="info">Info</option>
            <option value="success">Success</option>
            <option value="warning">Warning</option>
            <option value="danger">Alert</option>
          </select>
          <select id="filterRead">
            <option value="">All</option>
            <option value="false">Unread</option>
            <option value="true">Read</option>
          </select>
        </div>
        <div class="feed-stack" id="feed"></div>
        <div class="pagination" id="pagination"></div>
      </div>
    </div>
  </div>
  <script src="../js/app.js"></script>
  <script src="../js/sidebar.js"></script>
  <script>
  (async function () {
    const user = await MVSidebar.initLayout({ page: "notification.html", title: "Notifications" });
    if (!user) throw new Error("auth");

    const welcomeKey = "mv_notif_welcomed_" + user.id;
    if (!MV.listFor(MV.KEYS.notifications).length && !localStorage.getItem(welcomeKey)) {
      MV.pushNotification("Welcome to MicroVault", "Explore Dashboard, Savings, Budget, and Affordability from the sidebar.", "info");
      MV.pushNotification("Tip", "Use Help & Support for guided answers about navigation and savings.", "success");
      localStorage.setItem(welcomeKey, "1");
    }

    function typeIcon(type) {
      if (type === "success") return "circle-check";
      if (type === "warning") return "triangle-exclamation";
      if (type === "danger") return "circle-exclamation";
      return "bell";
    }

    const table = MV.createTableController({
      perPage: 6,
      getData: () => MV.listFor(MV.KEYS.notifications).map((n) => ({ ...n, readFlag: String(!!n.read) })),
      searchKeys: ["title", "message", "type"],
      paginationEl: "#pagination",
      renderRows(rows) {
        const feed = document.getElementById("feed");
        if (!rows.length) {
          feed.innerHTML = '<div class="empty-feed"><i class="fas fa-bell-slash"></i>No notifications yet</div>';
          return;
        }
        feed.innerHTML = rows
          .map((n) => {
            const type = n.type || "info";
            return (
              '<article class="feed-item' +
              (n.read ? "" : " is-unread") +
              '">' +
              '<div class="feed-ico ' +
              type +
              '"><i class="fas fa-' +
              typeIcon(type) +
              '"></i></div>' +
              '<div class="feed-body">' +
              '<div class="feed-top"><h3 class="feed-title">' +
              (n.title || "Notification") +
              '</h3><span class="badge badge-' +
              (type === "success" ? "success" : type === "warning" ? "warning" : type === "danger" ? "danger" : "info") +
              '">' +
              type +
              "</span>" +
              '<span class="badge ' +
              (n.read ? "badge-neutral" : "badge-info") +
              '">' +
              (n.read ? "Read" : "Unread") +
              "</span></div>" +
              '<p class="feed-text">' +
              (n.message || "") +
              "</p>" +
              '<div class="feed-meta"><span><i class="fas fa-calendar-day"></i>' +
              MV.formatDate(n.date || n.createdAt) +
              "</span></div></div>" +
              '<div class="feed-actions">' +
              (n.read
                ? ""
                : '<button class="btn btn-outline btn-sm" data-read="' +
                  n.id +
                  '">Mark read</button>') +
              '<button class="btn btn-danger btn-sm" data-del="' +
              n.id +
              '"><i class="fas fa-trash"></i></button>' +
              "</div></article>"
            );
          })
          .join("");

        feed.querySelectorAll("[data-read]").forEach((b) => {
          b.onclick = async () => {
            await MV.updateItem(MV.KEYS.notifications, b.dataset.read, { read: true });
            table.render();
          };
        });
        feed.querySelectorAll("[data-del]").forEach((b) => {
          b.onclick = () => {
            MV.confirmDelete("Are you sure you want to delete this notification?").then(async (ok) => {
              if (!ok) return;
              await MV.deleteItem(MV.KEYS.notifications, b.dataset.del);
              table.render();
            });
          };
        });
      },
    });
    table.bindSearch("#search");
    table.bindFilter("#filterType", "type");
    document.getElementById("filterRead").addEventListener("change", function () {
      table.state.filters.readFlag = this.value;
      table.state.page = 1;
      table.render();
    });
    table.render();

    document.getElementById("markAll").onclick = async function () {
      await MV.markAllNotificationsRead();
      table.render();
    };

    document.getElementById("clearAll").onclick = function () {
      const count = MV.listFor(MV.KEYS.notifications).length;
      if (!count) {
        MV.showNotice("There are no notifications to clear.", "Clear All");
        return;
      }
      MV.confirmDelete("Clear all " + count + " notification" + (count === 1 ? "" : "s") + "? This cannot be undone.").then(async (ok) => {
        if (!ok) return;
        await MV.saveFor(MV.KEYS.notifications, []);
        table.render();
      });
    };
  })();
  </script>
</body>
</html>
