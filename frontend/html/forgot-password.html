<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password | MicroVault</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="../css/app.css" />
</head>
<body>
  <div class="auth-page">
    <section class="auth-visual">
      <div class="brand"><i class="fas fa-vault"></i> MicroVault</div>
      <h1>Reset your password</h1>
      <p>Verify your registered email and set a new secure password for your MicroVault account.</p>
    </section>
    <section class="auth-panel">
      <div class="auth-card">
        <h2>Forgot password</h2>
        <p class="subtitle">Each step is validated before you continue</p>
        <form id="resetForm" novalidate>
          <div class="auth-field">
            <label for="email">Registered email</label>
            <input type="email" id="email" />
            <span class="field-error" id="emailError"></span>
          </div>
          <div class="auth-field">
            <label for="otp">Verification code</label>
            <input type="text" id="otp" maxlength="6" placeholder="Enter 6-digit code" />
            <span class="field-error" id="otpError"></span>
          </div>
          <button type="button" class="btn btn-outline" id="sendOtp" style="width:100%;margin-bottom:12px">Send verification code</button>
          <div class="auth-field">
            <label for="password">New password</label>
            <input type="password" id="password" />
            <span class="field-error" id="passwordError"></span>
          </div>
          <div class="auth-field">
            <label for="confirmPassword">Confirm new password</label>
            <input type="password" id="confirmPassword" />
            <span class="field-error" id="confirmPasswordError"></span>
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%">Update password</button>
        </form>
        <p class="bottom-text"><a href="login.html">Back to login</a></p>
      </div>
    </section>
  </div>
  <script src="../js/app.js"></script>
  <script>
    MV.bindPasswordToggles();
    let issuedOtp = "";
    function showErr(id, msg) {
      const el = document.getElementById(id + "Error");
      const input = document.getElementById(id);
      el.textContent = msg || "";
      el.style.display = msg ? "block" : "none";
      if (input) {
        input.classList.toggle("input-error", !!msg);
        input.classList.toggle("input-success", !msg && input.value);
      }
    }

    document.getElementById("sendOtp").addEventListener("click", async function () {
      const email = document.getElementById("email").value.trim();
      const err = MV.Validators.email(email);
      showErr("email", err);
      if (err) return;
      try {
        const res = await MV.sendResetOtp(email);
        issuedOtp = res.demoOtp || "";
        if (issuedOtp) {
          alert("Verification code (demo): " + issuedOtp);
        } else {
          alert("Verification code sent to your email.");
        }
        showErr("email", "");
      } catch (e) {
        showErr("email", e.message || "No account found with this email");
      }
    });

    document.getElementById("resetForm").addEventListener("submit", async function (e) {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const otp = document.getElementById("otp").value.trim();
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;
      const errors = {
        email: MV.Validators.email(email),
        otp: !otp ? "Verification code is required" : "",
        password: MV.Validators.password(password),
        confirmPassword: confirmPassword !== password ? "Passwords do not match" : "",
      };
      Object.keys(errors).forEach((k) => showErr(k, errors[k]));
      if (Object.values(errors).some(Boolean)) return;
      try {
        await MV.resetPassword({ email, otp, password, confirmPassword });
        alert("Password updated successfully. Please login.");
        window.location.href = "login.html";
      } catch (err) {
        showErr("otp", err.message || "Could not update password");
      }
    });
  </script>
</body>
</html>
