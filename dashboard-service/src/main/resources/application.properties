server.port=8083
spring.application.name=dashboard-service

auth-service.url=${AUTH_SERVICE_URL:http://localhost:8081}
finance-service.url=${FINANCE_SERVICE_URL:http://localhost:8082}
admin-service.url=${ADMIN_SERVICE_URL:http://localhost:8084}
microvault.internal.token=${INTERNAL_TOKEN:microvault-local}

spring.jackson.serialization.write-dates-as-timestamps=false
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.persistAuthorization=true
