server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      # CORS is handled at the gateway. Downstream services may also return
      # CORS headers, so remove duplicate response headers before they reach
      # the browser.
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials RETAIN_FIRST
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:4200"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: auth-service
          uri: ${auth-service.url:http://localhost:8081}
          predicates:
            - Path=/api/auth/**,/api/users/**
        - id: finance-service
          uri: ${finance-service.url:http://localhost:8082}
          predicates:
            - Path=/api/finance,/api/finance/**,/api/transactions,/api/transactions/**,/api/budgets,/api/budgets/**,/api/goals,/api/goals/**,/api/savings,/api/savings/**,/api/reports,/api/reports/**,/api/affordability,/api/affordability/**
        - id: dashboard-service
          uri: ${dashboard-service.url:http://localhost:8083}
          predicates:
            - Path=/api/dashboard
        - id: admin-service
          uri: ${admin-service.url:http://localhost:8084}
          predicates:
            - Path=/api/admin,/api/admin/**,/api/feedback,/api/feedback/**,/api/notifications,/api/notifications/**
