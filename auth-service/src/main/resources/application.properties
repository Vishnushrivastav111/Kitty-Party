server.port=8081
spring.application.name=auth-service

spring.datasource.url=${DB_URL:jdbc:postgresql://10.23.240.38:5432/indr_aug13_smartsavingsandinvestment_dev?connectTimeout=5}
spring.datasource.username=${DB_USERNAME:indr_aug13_smartsavingsandinvestment_dev}
spring.datasource.password=${DB_PASSWORD:TCS@123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
spring.jackson.serialization.write-dates-as-timestamps=false

# Set MAIL_ENABLED=true and the SMTP values to send the reset code by email.
# When mail is off, the code is returned as demoOtp so local login still works.
microvault.mail.enabled=${MAIL_ENABLED:false}
microvault.mail.from=${MAIL_FROM:noreply@microvault.local}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

microvault.jwt.secret=${JWT_SECRET:microvault-local-jwt-secret-change-me-32b}
microvault.jwt.expiration-hours=${JWT_EXPIRATION_HOURS:12}
microvault.internal.token=${INTERNAL_TOKEN:microvault-local}

microvault.seed.admin.full-name=${ADMIN_FULL_NAME:MicroVault Admin}
microvault.seed.admin.email=${ADMIN_EMAIL:admin@microvault.local}
microvault.seed.admin.phone=${ADMIN_PHONE:9876543210}
microvault.seed.admin.password=${ADMIN_PASSWORD:Admin@123}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.persistAuthorization=true
